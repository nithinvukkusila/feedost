name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm i18n:check
      - run: pnpm build
      - run: pnpm size
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      # Last, because it overwrites out/: a production build must not contain /dev/components.
      - name: Production build leaves out the dev routes
        # The folder must be gone, and so must the page's own words (a chunk could carry them without the route).
        run: |
          VERCEL_ENV=production pnpm build
          test ! -e out/dev
          ! grep -rqF "Venkatasubrahmanyalakshminarasimharao" out
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
