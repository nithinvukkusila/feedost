<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home: dues board</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=DM+Mono:wght@400;500&amp;family=Anek+Latin:wght@400..800&amp;display=swap">
<style>
body{margin:0}
a{color:#1B2B8F}a:hover{color:#101A5C}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 360px; height: 800px; box-sizing: border-box; background: #FAF3D3; color: #1A1410; font-family: 'Bricolage Grotesque','Anek Latin',system-ui,sans-serif; display: flex; flex-direction: column; overflow: hidden">

<header style="display: flex; align-items: center; justify-content: space-between; padding: 6px 8px 0 8px">
<div style="display: flex; align-items: center">
<button aria-label="Previous month" style="width: 44px; height: 44px; border: 0; background: none; color: #1A1410; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
<div style="font-family: 'DM Mono',monospace; font-size: 14px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; min-width: 124px; text-align: center">October 2026</div>
<button aria-label="Next month" style="width: 44px; height: 44px; border: 0; background: none; color: #1A1410; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
</div>
<a href="Claims.dc.html" aria-label="2 payments to confirm" style="height: 44px; padding: 0 12px; border: 2px solid #1A1410; border-radius: 4px; background: #F4C430; color: #1A1410; font-size: 14px; font-weight: 700; text-decoration: none; display: flex; align-items: center; gap: 6px; box-shadow: 3px 3px 0 #1A1410; margin-right: 8px">2 to confirm</a>
</header>

<section style="padding: 10px 20px 0 20px; display: flex; flex-direction: column">
<div style="font-size: 16px; font-weight: 700; color: #A81C22">Still to come in</div>
<div style="font-size: 68px; line-height: 0.92; font-weight: 800; letter-spacing: -0.04em; color: #1B2B8F">₹18,500</div>
<div style="font-size: 15.5px; color: #4A3F1E; margin-top: 2px">from 9 of your 23 students</div>

<div aria-label="23 students: 14 paid, 4 due, 5 overdue" style="margin-top: 12px; display: grid; grid-template-columns: repeat(23, minmax(0, 1fr)); gap: 3px; align-items: end; height: 24px">
<sc-for list="{{strip}}" as="s" hint-placeholder-count="23">
<div style="height: {{s.h}}; box-sizing: border-box; border: 1.5px solid {{s.border}}; background: {{s.bg}}"></div>
</sc-for>
</div>
<div style="margin-top: 6px; display: flex; gap: 14px; font-family: 'DM Mono',monospace; font-size: 14px; letter-spacing: 0.06em; text-transform: uppercase"><span style="color: #1F6B3C">14 paid</span><span style="color: #4A3F1E">4 due, hollow</span><span style="color: #A81C22">5 overdue, tall</span></div>

<a href="Remind.dc.html" style="margin-top: 14px; height: 58px; border: 2px solid #1A1410; border-radius: 4px; background: #1B2B8F; color: #FDF6D8; font-size: 18px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 5px 5px 0 #1A1410"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linejoin="round"><path d="M5 5h14a1 1 0 011 1v10a1 1 0 01-1 1h-8l-5 4v-4H5a1 1 0 01-1-1V6a1 1 0 011-1z"/></svg>Remind all 5 on WhatsApp</a>
</section>

<div role="tablist" style="display: flex; align-items: flex-end; gap: 4px; padding: 20px 16px 0 16px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
<button role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="height: {{t.h}}; padding: 0 14px; border: 2px solid #1A1410; border-bottom: 0; border-radius: 6px 6px 0 0; background: {{t.bg}}; color: {{t.fg}}; font-size: 15px; font-weight: 700">{{t.label}} {{t.count}}</button>
</sc-for>
<div style="flex-grow: 1"></div>
<button style="height: 44px; padding: 0 4px; border: 0; background: none; color: #1A1410; font-size: 14px; font-weight: 700; text-decoration: underline">All batches</button>
</div>

<div style="flex-grow: 1; min-height: 0; overflow: hidden; margin: 0 16px; background: #FDF6D8; border: 2px solid #1A1410; border-bottom: 0; padding: 0 12px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
<div style="min-height: 66px; border-bottom: 1px solid #C9B56A; display: flex; align-items: center; gap: 8px">
<a href="Student.dc.html" style="flex-grow: 1; min-width: 0; min-height: 48px; display: flex; align-items: center; gap: 8px; text-decoration: none; color: #1A1410">
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</span><span style="font-size: 14px; font-weight: 600; color: {{r.metaColor}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.meta}}</span></span>
<span style="font-family: 'DM Mono','Anek Latin',monospace; font-size: 16px; font-weight: 500; flex-shrink: 0">{{r.amount}}</span>
</a>
<sc-if value="{{r.canRemind}}" hint-placeholder-val="{{ true }}">
<a href="Remind.dc.html" aria-label="Remind parent of {{r.name}} on WhatsApp" style="width: 48px; height: 48px; box-sizing: border-box; border: 2px solid #1A1410; border-radius: 50%; background: #1B2B8F; color: #FDF6D8; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 3px 3px 0 #1A1410; margin-right: 3px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linejoin="round"><path d="M5 5h14a1 1 0 011 1v10a1 1 0 01-1 1h-8l-5 4v-4H5a1 1 0 01-1-1V6a1 1 0 011-1z"/></svg></a>
</sc-if>
<sc-if value="{{r.paid}}" hint-placeholder-val="{{ false }}">
<span style="width: 52px; height: 52px; box-sizing: border-box; border: 3px double #1F6B3C; border-radius: 50%; color: #1F6B3C; font-size: 14px; font-weight: 800; letter-spacing: 0.04em; display: flex; align-items: center; justify-content: center; transform: rotate(-12deg); flex-shrink: 0">PAID</span>
</sc-if>
</div>
</sc-for>
</div>

<dc-import name="Nav" active="home" hint-size="360px,64px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
renderVals() {
const tab = (this.state && this.state.tab) || 'overdue';
const data = {
overdue: [
['Ravi Kumar', '7 days late · Class 10 Maths', '₹1,200'],
['Ananya Shetty', '7 days late · reminded 2 days ago', '₹1,500'],
['Imran Mohammed', 'Part paid ₹500 · 5 days late', '₹700'],
['Pooja Gowda', '3 days late · Class 8 Science', '₹1,000'],
['Suresh Naik', '3 days late · 2 months pending', '₹2,400']
],
due: [
['Divya Rao', 'Due 10 Oct · Class 10 Maths', '₹1,200'],
['Kiran Patil', 'Due 10 Oct · Class 8 Science', '₹1,000'],
['Fatima Ali', 'Due 15 Oct · Class 10 Maths', '₹1,200'],
['Varun Hegde', 'Due 20 Oct · Class 8 Science', '₹1,000']
],
paid: [
['Neha Bhat', '06 Oct · UPI · Receipt 214', '₹1,200'],
['Arjun Joshi', '05 Oct · Cash · Receipt 213', '₹1,000'],
['Lakshmi Devi', '03 Oct · UPI · Receipt 212', '₹1,500'],
['Tanvi Menon', '02 Oct · UPI · Receipt 211', '₹1,200'],
['Zoya Khan', '01 Oct · Cash · Receipt 210', '₹1,000']
]
};
const metaColor = { overdue: '#A81C22', due: '#4A3F1E', paid: '#1F6B3C' }[tab];
const rows = data[tab].map(([name, meta, amount]) => ({ name, meta, amount, metaColor, canRemind: tab !== 'paid', paid: tab === 'paid' }));
const tabs = [['overdue', 'Overdue', 5], ['due', 'Due', 4], ['paid', 'Paid', 14]].map(([id, label, count]) => {
const on = id === tab;
return { label, count, on, h: on ? '48px' : '44px', bg: on ? '#FDF6D8' : '#E6D38A', fg: on ? '#1A1410' : '#4A3F1E', pick: () => this.setState({ tab: id }) };
});
const strip = [];
for (let i = 0; i < 23; i++) {
if (i < 14) strip.push({ bg: '#1F6B3C', border: '#1F6B3C', h: '14px' });
else if (i < 18) strip.push({ bg: '#FDF6D8', border: '#1A1410', h: '14px' });
else strip.push({ bg: '#A81C22', border: '#A81C22', h: '24px' });
}
return { tabs, rows, strip };
}
}
</script>
</body>
</html>
