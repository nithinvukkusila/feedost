<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Students list</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=DM+Mono:wght@400;500&amp;family=Anek+Latin:wght@400..800&amp;display=swap">
<style>
body{margin:0}
a{color:#1B2B8F}a:hover{color:#101A5C}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 360px; height: 800px; box-sizing: border-box; background: #FAF3D3; color: #1A1410; font-family: 'Bricolage Grotesque','Anek Latin',system-ui,sans-serif; display: flex; flex-direction: column; overflow: hidden">

<header style="display: flex; align-items: flex-end; justify-content: space-between; padding: 18px 22px 0 20px">
<div>
<div style="font-family: 'DM Mono',monospace; font-size: 14px; letter-spacing: 0.04em; text-transform: uppercase; color: #6B5B2A">23 names · 2 batches</div>
<h1 style="margin: 0; font-size: 44px; line-height: 0.95; font-weight: 800; letter-spacing: -0.04em">Students</h1>
</div>
<a href="Setup-add.dc.html" style="height: 52px; padding: 0 18px; border: 2px solid #1A1410; border-radius: 4px; background: #1A1410; color: #FDF6D8; font-size: 17px; font-weight: 700; text-decoration: none; display: flex; align-items: center; gap: 6px; box-shadow: 4px 4px 0 #6B5B2A"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.600" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add</a>
</header>

<div style="padding: 14px 20px 0 20px">
<div style="display: flex; align-items: center; gap: 8px; height: 48px; border-bottom: 2px solid #1A1410; color: #4A3F1E">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round"><circle cx="11" cy="11" r="6.500"/><path d="M16 16l4.500 4.500"/></svg>
<input aria-label="Search students or parents" placeholder="Search student or parent" style="flex-grow: 1; min-width: 0; border: 0; outline: 0; background: none; font: inherit; font-size: 17px; color: #1A1410">
</div>
</div>

<div style="display: flex; align-items: flex-end; gap: 4px; padding: 16px 16px 0 16px">
<button aria-pressed="true" style="height: 48px; padding: 0 12px; border: 2px solid #1A1410; border-bottom: 0; border-radius: 6px 6px 0 0; background: #FDF6D8; color: #1A1410; font-size: 14.5px; font-weight: 700">All 23</button>
<button aria-pressed="false" style="height: 44px; padding: 0 12px; border: 2px solid #1A1410; border-bottom: 0; border-radius: 6px 6px 0 0; background: #E6D38A; color: #4A3F1E; font-size: 14.5px; font-weight: 700">10 Maths 12</button>
<button aria-pressed="false" style="height: 44px; padding: 0 12px; border: 2px solid #1A1410; border-bottom: 0; border-radius: 6px 6px 0 0; background: #E6D38A; color: #4A3F1E; font-size: 14.5px; font-weight: 700">8 Science 11</button>
</div>

<div style="flex-grow: 1; min-height: 0; overflow: hidden; margin: 0 16px; background: #FDF6D8; border: 2px solid #1A1410; border-bottom: 0; padding: 0 12px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
<a href="Student.dc.html" style="min-height: 60px; display: flex; align-items: center; gap: 10px; text-decoration: none; color: #1A1410; border-bottom: 1px solid #C9B56A">
<span style="font-family: 'DM Mono',monospace; font-size: 14px; color: #6B5B2A; width: 20px; flex-shrink: 0">{{r.no}}</span>
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</span><span style="font-size: 14px; color: #4A3F1E; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">₹{{r.fee}} on the {{r.day}} · {{r.batch}}</span></span>
<span style="padding: 3px 7px; border: 2px {{r.line}} {{r.fg}}; background: {{r.bg}}; color: {{r.fg}}; font-family: 'DM Mono',monospace; font-size: 14px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; flex-shrink: 0">{{r.status}}</span>
</a>
</sc-for>
</div>

<dc-import name="Nav" active="students" hint-size="360px,64px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
renderVals() {
const tone = {
Overdue: { fg: '#A81C22', bg: 'transparent', line: 'solid' },
Due: { fg: '#1A1410', bg: '#F4C430', line: 'solid' },
'Part paid': { fg: '#1B2B8F', bg: 'transparent', line: 'dashed' },
Paid: { fg: '#1F6B3C', bg: 'transparent', line: 'double' }
};
const rows = [
['Ananya Shetty', '10 Maths', '1,500', '1st', 'Overdue'],
['Arjun Joshi', '8 Science', '1,000', '5th', 'Paid'],
['Divya Rao', '10 Maths', '1,200', '10th', 'Due'],
['Fatima Ali', '10 Maths', '1,200', '15th', 'Due'],
['Imran Mohammed', '10 Maths', '1,200', '3rd', 'Part paid'],
['Kiran Patil', '8 Science', '1,000', '10th', 'Due'],
['Lakshmi Devi', '10 Maths', '1,500', '1st', 'Paid'],
['Neha Bhat', '10 Maths', '1,200', '5th', 'Paid'],
['Pooja Gowda', '8 Science', '1,000', '5th', 'Overdue']
].map(([name, batch, fee, day, status], i) => ({ no: String(i + 1).padStart(2, '0'), name, batch, fee, day, status, ...tone[status] }));
return { rows };
}
}
</script>
</body>
</html>
