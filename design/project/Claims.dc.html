<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Payments to confirm</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=DM+Mono:wght@400;500&amp;family=Anek+Latin:wght@400..800&amp;display=swap">
<style>
body{margin:0}
a{color:#1B2B8F}a:hover{color:#101A5C}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 360px; height: 800px; box-sizing: border-box; background: #FAF3D3; color: #1A1410; font-family: 'Bricolage Grotesque','Anek Latin',system-ui,sans-serif; display: flex; flex-direction: column; overflow: hidden">

<header style="padding: 6px 8px 0 8px">
<a href="Home.dc.html" aria-label="Back to home" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #1A1410"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></a>
</header>
<div style="padding: 0 20px">
<h1 style="margin: 0; font-size: 40px; line-height: 0.92; font-weight: 800; letter-spacing: -0.04em">2 parents say they've paid</h1>
<p style="margin: 8px 0 0 0; font-size: 15.5px; line-height: 1.35; color: #4A3F1E">Check your UPI app, then confirm.</p>
</div>

<div style="padding: 16px 22px 0 16px; display: flex; flex-direction: column; gap: 18px">
<sc-for list="{{claims}}" as="c" hint-placeholder-count="2">
<article style="background: #FDF6D8; border: 2px solid #1A1410; box-shadow: 6px 6px 0 #1A1410; padding: 14px 16px 16px 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 10px">
<div style="min-width: 0"><div style="font-family: 'DM Mono',monospace; font-size: 14px; letter-spacing: 0.04em; text-transform: uppercase; color: #6B5B2A">{{c.when}}</div><div style="font-size: 22px; line-height: 1.1; font-weight: 800; letter-spacing: -0.03em">{{c.name}}</div></div>
<div style="font-size: 34px; line-height: 0.95; font-weight: 800; letter-spacing: -0.04em; color: #1B2B8F">{{c.amount}}</div>
</div>
<div style="border-top: 1px dashed #1A1410; border-bottom: 1px dashed #1A1410; min-height: 52px; display: flex; justify-content: space-between; align-items: center; gap: 8px">
<div><div style="font-family: 'DM Mono',monospace; font-size: 14px; letter-spacing: 0.04em; text-transform: uppercase; color: #6B5B2A">{{c.proofLabel}}</div><div style="font-family: 'DM Mono',monospace; font-size: 17px; font-weight: 500">{{c.proof}}</div></div>
<button style="height: 44px; padding: 0 4px; border: 0; background: none; color: #1B2B8F; font-size: 15px; font-weight: 700; text-decoration: underline">{{c.proofAction}}</button>
</div>
<div style="display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 12px">
<button style="height: 52px; border: 2px solid #1A1410; border-radius: 4px; background: none; color: #1A1410; font-size: 15px; font-weight: 700">Not received</button>
<button style="height: 52px; border: 2px solid #1A1410; border-radius: 4px; background: #1F6B3C; color: #FDF6D8; font-size: 17px; font-weight: 800; box-shadow: 4px 4px 0 #1A1410">Confirm paid</button>
</div>
</article>
</sc-for>
</div>

<section style="flex-grow: 1; min-height: 0; overflow: hidden; margin: 24px 16px 0 16px; background: #FDF6D8; border: 2px solid #1A1410; border-bottom: 0; padding: 10px 12px 0 12px">
<h2 style="margin: 0; font-family: 'DM Mono',monospace; font-size: 14px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; color: #6B5B2A">Earlier</h2>
<div style="min-height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 10px; border-bottom: 1px solid #C9B56A"><span><span style="display: block; font-size: 16px; font-weight: 700">Neha Bhat</span><span style="display: block; font-family: 'DM Mono',monospace; font-size: 14px; color: #1F6B3C">CONFIRMED 06 OCT · NO. 214 SENT</span></span><span style="font-family: 'DM Mono','Anek Latin',monospace; font-size: 15px">₹1,200</span></div>
<div style="min-height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 10px"><span><span style="display: block; font-size: 16px; font-weight: 700">Kiran Patil</span><span style="display: block; font-family: 'DM Mono',monospace; font-size: 14px; color: #4A3F1E">NOT RECEIVED 02 OCT</span></span><span style="font-family: 'DM Mono','Anek Latin',monospace; font-size: 15px">₹1,000</span></div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
renderVals() {
const claims = [
{ when: 'Today 4:12 pm · October', name: 'Ravi Kumar', amount: '₹1,200', proofLabel: 'UPI reference', proof: '6281 0473 9915', proofAction: 'Copy' },
{ when: 'Yesterday 9:40 pm · October', name: 'Pooja Gowda', amount: '₹1,000', proofLabel: 'Proof', proof: 'Screenshot', proofAction: 'View' }
];
return { claims };
}
}
</script>
</body>
</html>
