<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Student detail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=DM+Mono:wght@400;500&amp;family=Anek+Latin:wght@400..800&amp;display=swap">
<style>
body{margin:0}
a{color:#1B2B8F}a:hover{color:#101A5C}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 360px; height: 800px; box-sizing: border-box; background: #FAF3D3; color: #1A1410; font-family: 'Bricolage Grotesque','Anek Latin',system-ui,sans-serif; display: flex; flex-direction: column; overflow: hidden">

<header style="display: flex; align-items: center; justify-content: space-between; padding: 6px 8px 0 8px">
<a href="Home.dc.html" aria-label="Back to home" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #1A1410"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></a>
<button style="height: 44px; padding: 0 12px; border: 0; background: none; color: #1A1410; font-size: 15px; font-weight: 700; text-decoration: underline">Edit</button>
</header>

<div style="padding: 4px 20px 0 20px">
<div style="font-family: 'DM Mono',monospace; font-size: 14px; letter-spacing: 0.04em; text-transform: uppercase; color: #6B5B2A">Class 10 Maths · Mon Wed Fri 5 pm</div>
<h1 style="margin: 2px 0 0 0; font-size: 40px; line-height: 0.95; font-weight: 800; letter-spacing: -0.04em">Ravi Kumar</h1>
</div>

<section style="margin: 16px 20px 0 16px; background: #FDF6D8; border: 2px solid #1A1410; box-shadow: 6px 6px 0 #1A1410; padding: 16px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 8px">
<div>
<div style="font-size: 15px; font-weight: 700">October fee</div>
<div style="font-size: 64px; line-height: 0.95; font-weight: 800; letter-spacing: -0.04em; color: #1B2B8F">₹1,200</div>
</div>
<span style="padding: 5px 8px; border: 2px solid #A81C22; color: #A81C22; font-family: 'DM Mono',monospace; font-size: 14px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap">Overdue 7 days</span>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<a href="Remind.dc.html" style="height: 56px; border: 2px solid #1A1410; border-radius: 4px; background: #1B2B8F; color: #FDF6D8; font-size: 18px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 4px 4px 0 #1A1410"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linejoin="round"><path d="M5 5h14a1 1 0 011 1v10a1 1 0 01-1 1h-8l-5 4v-4H5a1 1 0 01-1-1V6a1 1 0 011-1z"/></svg>Remind</a>
<a href="Pay-sheet.dc.html" style="height: 56px; border: 2px solid #1A1410; border-radius: 4px; background: #1A1410; color: #FDF6D8; font-size: 18px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center; box-shadow: 4px 4px 0 #6B5B2A">Mark paid</a>
</div>
<div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px dashed #1A1410; padding-top: 8px">
<span style="font-size: 14px; color: #4A3F1E">Reminded 2 days ago.<br>Pay page opened once.</span>
<button style="height: 44px; padding: 0 4px; border: 0; background: none; color: #1B2B8F; font-size: 15px; font-weight: 700; text-decoration: underline">Share pay link</button>
</div>
</section>

<div style="margin: 22px 16px 0 16px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 2px solid #1A1410; border-bottom: 2px solid #1A1410">
<div style="padding: 8px 8px 8px 4px; border-right: 1px solid #1A1410"><div style="font-family: 'DM Mono',monospace; font-size: 14px; letter-spacing: 0.04em; text-transform: uppercase; color: #6B5B2A">Monthly</div><div style="font-size: 22px; font-weight: 800; letter-spacing: -0.03em">₹1,200</div></div>
<div style="padding: 8px; border-right: 1px solid #1A1410"><div style="font-family: 'DM Mono',monospace; font-size: 14px; letter-spacing: 0.04em; text-transform: uppercase; color: #6B5B2A">Due day</div><div style="font-size: 22px; font-weight: 800; letter-spacing: -0.03em">1st</div></div>
<div style="padding: 8px"><div style="font-family: 'DM Mono',monospace; font-size: 14px; letter-spacing: 0.04em; text-transform: uppercase; color: #6B5B2A">Attended</div><div style="font-size: 22px; font-weight: 800; letter-spacing: -0.03em">3 of 4</div></div>
</div>

<div style="margin: 12px 20px 0 20px">
<div style="font-family: 'DM Mono',monospace; font-size: 14px; letter-spacing: 0.04em; text-transform: uppercase; color: #6B5B2A">Parent · messages in Kannada</div>
<div style="font-size: 17px; font-weight: 700">Suresh Kumar · +91 98450 12345</div>
</div>

<section style="flex-grow: 1; min-height: 0; overflow: hidden; margin: 14px 16px 0 16px; background: #FDF6D8; border: 2px solid #1A1410; border-bottom: 0; padding: 10px 12px 0 12px">
<h2 style="margin: 0; font-family: 'DM Mono',monospace; font-size: 14px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; color: #6B5B2A">Earlier entries</h2>
<sc-for list="{{history}}" as="h" hint-placeholder-count="3">
<a href="Receipt.dc.html" style="min-height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 10px; text-decoration: none; color: #1A1410; border-bottom: 1px solid #C9B56A"><span><span style="display: block; font-size: 16px; font-weight: 700">{{h.month}}</span><span style="display: block; font-family: 'DM Mono',monospace; font-size: 14px; color: #1F6B3C">{{h.meta}}</span></span><span style="font-family: 'DM Mono','Anek Latin',monospace; font-size: 16px; font-weight: 500">₹1,200</span></a>
</sc-for>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
renderVals() {
const history = [
{ month: 'September', meta: 'PAID 03 SEP · UPI · NO. 198' },
{ month: 'August', meta: 'PAID 12 AUG · CASH · NO. 171' },
{ month: 'July', meta: 'PAID 02 JUL · UPI · NO. 144' }
];
return { history };
}
}
</script>
</body>
</html>
