<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Marked paid, with undo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=DM+Mono:wght@400;500&amp;family=Anek+Latin:wght@400..800&amp;display=swap">
<style>
body{margin:0}
a{color:#1B2B8F}a:hover{color:#101A5C}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 360px; height: 800px; box-sizing: border-box; background: #FAF3D3; color: #1A1410; font-family: 'Bricolage Grotesque','Anek Latin',system-ui,sans-serif; display: flex; flex-direction: column; overflow: hidden">

<section style="padding: 22px 20px 0 20px">
<div style="font-family: 'DM Mono',monospace; font-size: 14px; letter-spacing: 0.04em; text-transform: uppercase; color: #6B5B2A">October 2026</div>
<div style="font-size: 16px; font-weight: 700; color: #A81C22; margin-top: 8px">Still to come in</div>
<div style="font-size: 68px; line-height: 0.92; font-weight: 800; letter-spacing: -0.04em; color: #1B2B8F">₹17,300</div>
<div style="font-size: 15.5px; color: #4A3F1E; margin-top: 2px">from 8 of your 23 students</div>
</section>

<div style="flex-grow: 1; min-height: 0; overflow: hidden; margin: 20px 16px 0 16px; background: #FDF6D8; border: 2px solid #1A1410; border-bottom: 0; padding: 0 12px">
<div style="min-height: 70px; border-bottom: 1px solid #C9B56A; display: flex; align-items: center; gap: 10px; background: #E4F0D2; margin: 0 -12px; padding: 0 12px">
<div style="flex-grow: 1; min-width: 0"><div style="font-size: 17px; font-weight: 700">Ravi Kumar</div><div style="font-family: 'DM Mono',monospace; font-size: 14px; color: #1F6B3C">PAID TODAY · UPI · NO. 215</div></div>
<div style="font-family: 'DM Mono','Anek Latin',monospace; font-size: 16px">₹1,200</div>
<span style="width: 56px; height: 56px; box-sizing: border-box; border: 3px double #1F6B3C; border-radius: 50%; color: #1F6B3C; font-size: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center; transform: rotate(-12deg); flex-shrink: 0">PAID</span>
</div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
<div style="min-height: 66px; border-bottom: 1px solid #C9B56A; display: flex; align-items: center; gap: 10px">
<div style="flex-grow: 1; min-width: 0"><div style="font-size: 17px; font-weight: 700">{{r.name}}</div><div style="font-size: 14px; font-weight: 600; color: #A81C22">{{r.late}}</div></div>
<div style="font-family: 'DM Mono','Anek Latin',monospace; font-size: 16px">{{r.amount}}</div>
</div>
</sc-for>
</div>

<div role="status" style="margin: 0 12px 12px 12px; background: #1A1410; color: #FDF6D8; border-radius: 4px; padding: 12px 8px 12px 16px; display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 16px; font-weight: 700">Ravi Kumar marked paid, ₹1,200</div>
<div style="display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 8px; padding-right: 8px">
<button style="height: 48px; border: 2px solid #FDF6D8; border-radius: 4px; background: none; color: #FDF6D8; font-size: 16px; font-weight: 700">Undo</button>
<a href="Receipt.dc.html" style="height: 48px; box-sizing: border-box; border: 2px solid #FDF6D8; border-radius: 4px; background: #FDF6D8; color: #1A1410; font-size: 16px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linejoin="round"><path d="M5 5h14a1 1 0 011 1v10a1 1 0 01-1 1h-8l-5 4v-4H5a1 1 0 01-1-1V6a1 1 0 011-1z"/></svg>Send receipt</a>
</div>
</div>

<dc-import name="Nav" active="home" hint-size="360px,64px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
renderVals() {
const rows = [
{ name: 'Ananya Shetty', late: '7 days late', amount: '₹1,500' },
{ name: 'Imran Mohammed', late: 'Part paid ₹500 · 5 days late', amount: '₹700' },
{ name: 'Pooja Gowda', late: '3 days late', amount: '₹1,000' }
];
return { rows };
}
}
</script>
</body>
</html>
